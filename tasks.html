<!DOCTYPE html>
<html>
    <head>
        <title>Arrays and loops tasks</title>
    </head>
    <body>
        <script>
            const lorem = [0, 10, 15, 22];
            const ipsum = ['Hi', 'Hello', 'Random', 'Words'];

            function getLastValue(array) {
                console.log(array[array.length - 1])
            }

            getLastValue(lorem);
            getLastValue(ipsum);

            function arraySwap(array) {
                let arrayFirstValue = array[0];
                let arrayLastValue = array[array.length - 1];

                let newArrayFirstValue = array[0] = arrayLastValue;
                let newArrayLastValue = array[array.length - 1] = arrayFirstValue;

                console.log(array);
            }

            arraySwap(lorem);
            arraySwap(ipsum);

            const nums = [-3, 10, 15, 2, 109];

            function minMax(array) {
                let min = array[0];
                let max = array[0];

                for (let i = 1; i < array.length; i++) {
                    if (array[i] < min) {
                        min = array[i];
                    }

                    if (array[i] > max) {
                        max = array[i];
                    }
                }

                return {
                    min: min,
                    max: max
                }
            }

            console.log(minMax(nums));
            console.log(minMax([]));

            const words = ['apple', 'apple', 'orange', 'apple', 'banana', 'orange']

            function countWords(words) {
                const result = {}

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];

                    if (result[word]) {
                        result[word] += 1;
                    } else {
                        result[word] = 1;
                    }
                }

                console.log(result);
            }

            countWords(words);
        </script>
    </body>
</html>
